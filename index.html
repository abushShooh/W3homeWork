<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manifold Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body
    class="min-h-screen bg-white text-black antialiased font-light"
    style="font-family: 'Montserrat', sans-serif; font-optical-sizing: auto;"
  >
    <header class="bg-white">
      <div class="mx-auto max-w-[1200px] px-5 py-5 sm:px-8 lg:px-[58px] lg:py-0">
        <div class="flex min-h-[72px] items-center justify-between lg:min-h-[104px]">
          <a href="#" class="shrink-0">
            <img
              src="./IMAGES/TEXT_LOGO.svg"
              alt="Manifold"
              class="h-8 w-auto"
            />
          </a>

          <button
            id="menu-toggle"
            type="button"
            class="inline-flex h-12 w-12 items-center justify-center text-[#ff3645] transition hover:text-[#f22939] lg:hidden"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Toggle menu"
          >
            <span class="sr-only">Toggle menu</span>
            <span class="flex flex-col gap-[5px]">
              <span class="block h-0.5 w-5 bg-current"></span>
              <span class="block h-0.5 w-5 bg-current"></span>
              <span class="block h-0.5 w-5 bg-current"></span>
            </span>
          </button>

          <div class="hidden items-center gap-10 lg:flex lg:flex-1 lg:justify-between lg:pl-[76px]">
            <nav
              aria-label="Primary"
              class="flex flex-wrap items-center gap-x-8 gap-y-3 text-[18px] leading-none text-black xl:gap-x-16"
            >
              <a href="#" class="transition hover:text-black/60">Services</a>
              <a href="#" class="transition hover:text-black/60">Portfolio</a>
              <a href="#" class="transition hover:text-black/60"
                >Email Marketing Audit</a
              >
            </nav>

            <a
              href="#"
              class="inline-flex shrink-0 items-center justify-center rounded-[6px] bg-[#ff3645] px-7 py-[14px] text-[16px] font-bold uppercase tracking-[0.02em] text-white transition hover:bg-[#f22939]"
            >
              Contact Us
            </a>
          </div>
        </div>

        <div id="mobile-menu" class="hidden border-t border-black/10 pb-2 pt-5 lg:hidden">
          <nav
            aria-label="Mobile primary"
            class="flex flex-col items-center gap-4 text-center text-[18px] leading-none text-black"
          >
            <a href="#" class="transition hover:text-black/60">Services</a>
            <a href="#" class="transition hover:text-black/60">Portfolio</a>
            <a href="#" class="transition hover:text-black/60"
              >Email Marketing Audit</a
            >
          </nav>

          <a
            href="#"
            class="mt-5 inline-flex w-full items-center justify-center rounded-[6px] bg-[#ff3645] px-7 py-[14px] text-[16px] font-bold uppercase tracking-[0.02em] text-white transition hover:bg-[#f22939]"
          >
            Contact Us
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="bg-white">
        <div
          class="relative isolate z-10 mx-auto max-w-[1200px] overflow-hidden bg-cover bg-right bg-no-repeat px-5 pb-16 pt-6 sm:px-8 md:pb-20 lg:px-[58px] lg:pb-24 lg:pt-10"
          style="background-image: url('./IMAGES/BG1.svg');"
        >
          <div class="max-w-[880px]">
            <h1
              class="max-w-[720px] text-[28px] font-black uppercase leading-[0.95] tracking-[-0.04em] text-black sm:text-[36px] md:text-[46px] lg:text-[58px] xl:text-[66px]"
            >
              <span class="text-[#ff3645]">Boost</span> Your Email
              <span class="block">Marketing Results!</span>
            </h1>

            <p
              class="mt-4 max-w-[560px] text-[15px] font-light leading-[1.4] text-black/80 sm:text-[17px] md:mt-5 md:text-[19px] lg:text-[21px]"
            >
              We help B2C brands grow their email-attributed revenue
            </p>

            <a
              href="#"
              class="mt-6 inline-flex min-h-[56px] items-center justify-center rounded-[6px] bg-[#ff3645] px-5 text-center text-[14px] font-semibold uppercase tracking-[0.01em] text-white transition hover:bg-[#f22939] sm:mt-7 sm:px-7"
            >
              Boost Your Results
            </a>
          </div>
        </div>
      </section>

      <section class="bg-white py-10 sm:py-12 lg:py-14">
        <div class="mx-auto max-w-[1200px] px-5 sm:px-8 lg:px-[58px]">
          <div class="grid grid-cols-2 items-center gap-x-8 gap-y-10 sm:grid-cols-3 lg:grid-cols-6 lg:gap-x-10">
            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/6476f21ab8cad4706f751e11_lev 1.svg"
                alt="Lev Haolam"
                class="h-[40px] w-auto sm:h-[44px]"
              />
            </div>

            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/63c1e4b88ffd31f87447e4ff_sch400 1.svg"
                alt="Schneider Electric"
                class="h-[34px] w-auto sm:h-[38px]"
              />
            </div>

            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/63c1e4ae1a141592370cc036_ali400 1.svg"
                alt="AliExpress"
                class="h-[28px] w-auto sm:h-[32px]"
              />
            </div>

            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/63c1e496dd3beb601e472dd7_lrp400 1.svg"
                alt="La Roche-Posay"
                class="h-[48px] w-auto sm:h-[54px]"
              />
            </div>

            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/63c1e46417b0ed71a5fcd3d8_pjp400 1.svg"
                alt="Papa Johns"
                class="h-[24px] w-auto sm:h-[28px]"
              />
            </div>

            <div class="flex items-center justify-center">
              <img
                src="./IMAGES/63c1e4a319ef310f2e094bec_kfc400 1.svg"
                alt="KFC"
                class="h-[34px] w-auto sm:h-[40px]"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      if (menuToggle && mobileMenu) {
        menuToggle.addEventListener("click", () => {
          const isHidden = mobileMenu.classList.contains("hidden");

          mobileMenu.classList.toggle("hidden");
          menuToggle.setAttribute("aria-expanded", String(isHidden));
        });
      }
    </script>
  </body>
</html>
